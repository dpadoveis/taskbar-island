# Builds the single-file TaskbarIsland.exe and attaches it to a GitHub Release
# whenever a version tag (v1.0.0, v1.1.0, ...) is pushed.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test native/TaskbarIsland.Tests/TaskbarIsland.Tests.csproj -c Release

      - name: Publish (self-contained single file, no .NET install needed)
        run: >
          dotnet publish native/TaskbarIsland/TaskbarIsland.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/TaskbarIsland.exe -DestinationPath TaskbarIsland-win-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TaskbarIsland-win-x64.zip
          generate_release_notes: true
